apply plugin: 'com.android.library'
android {
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 28
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    // 推荐添加此配置，避免 ABI 过滤问题
    android.splits.abi {
        reset()
        enable true
        include 'armeabi-v7a', 'arm64-v8a', 'armeabi' // 支持主流设备架构
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
